[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-sdk"
version = "1.0.0"
description = "Official Aegis Authentication API SDK for Python"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Aegis" }]
keywords = ["aegis", "authentication", "licensing", "sdk"]
dependencies = []

[tool.setuptools]
packages = ["aegis"]